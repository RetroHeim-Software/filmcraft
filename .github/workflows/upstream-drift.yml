# Weekly: how far is retroheim/main behind public upstream, does upstream still merge into it
# cleanly, do the eight carried crates pass on the merged result. Never pushes. Issues are
# disabled on this repository, so the report goes to the run's job summary and the run fails
# while there is drift (a failed scheduled run notifies the repository's owner by email); it
# passes once retroheim/main contains upstream. This file must live on the repository's default
# branch (retroheim/main).
name: upstream-drift

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false # the job has no need to push, and cannot

      - name: Add public upstream as a remote
        run: git remote add upstream https://github.com/storytold/filmcraft.git

      - name: Check drift (fetch, merge in memory, test in a scratch worktree)
        run: |
          set +e
          DRIFT_REPORT="$RUNNER_TEMP/drift.md" scripts/check-upstream-drift.sh
          status=$?
          set -e
          if [ -s "$RUNNER_TEMP/drift.md" ]; then
            cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Upstream drift\n\nThe check could not run (status %s). See the log above.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
